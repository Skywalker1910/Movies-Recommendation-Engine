services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       movie_db
      POSTGRES_USER:     movie_user
      POSTGRES_PASSWORD: movie_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_db"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Backend (Flask) ─────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV:      development
      DATABASE_URL:   postgresql://movie_user:movie_pass@db:5432/movie_db
      SECRET_KEY:     dev-secret-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
      CORS_ORIGINS:   http://localhost:3000
    volumes:
      # Mount the entire project root so ML models and datasets are accessible
      - ..:/workspace:ro
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (React) ────────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

